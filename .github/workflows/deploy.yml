name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, never cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the site is complete
        run: |
          test -f index.html || { echo "index.html missing"; exit 1; }
          test -f styles.css || { echo "styles.css missing"; exit 1; }
          test -f script.js  || { echo "script.js missing";  exit 1; }
          # every local asset referenced in index.html must exist
          grep -oE '(assets/[A-Za-z0-9._-]+)' index.html | sort -u | while read -r f; do
            test -f "$f" || { echo "referenced asset missing: $f"; exit 1; }
          done
          echo "Site looks complete."

      # configure-pages cannot enable Pages with the default GITHUB_TOKEN,
      # so check up front and fail with a clickable instruction instead of
      # an opaque 404 from the API.
      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "Pages is enabled."
          else
            echo "::error::GitHub Pages is not enabled for this repository (GET /pages returned $code)."
            echo "::error::Open https://github.com/${{ github.repository }}/settings/pages and set Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
